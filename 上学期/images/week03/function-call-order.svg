<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
<title id="title">调用时进入函数，返回后继续执行</title><desc id="desc">先显示开始计算，再调用 add_bonus(70)。score 接收 70，函数返回 80，赋给 result 后显示结果，最后显示计算结束。</desc>
<defs><marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563a6"/></marker><marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#137b68"/></marker></defs>
<rect width="1000" height="680" rx="18" fill="#f5f8fc"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, Droid Sans Fallback, sans-serif" fill="#183044">
<text x="36" y="47" font-size="28" fill="#183044" font-weight="bold">调用时进入函数，返回后继续执行</text>
<text x="36" y="86" font-size="21" fill="#526778" font-weight="normal">函数定义建立后，从下方的第一条提示开始观察。</text>
<text x="42" y="130" font-size="22" fill="#2563a6" font-weight="bold">调用处</text>
<text x="634" y="130" font-size="22" fill="#137b68" font-weight="bold">add_bonus 函数</text>
<rect x="36" y="150" width="480" height="62" rx="12" fill="white" stroke="#ccd9e4" stroke-width="1.5"/>
<text x="55" y="189" font-size="23" fill="#183044" font-weight="normal">①  print(&quot;开始计算&quot;)</text>
<path d="M 276 214 V 242" fill="none" stroke="#2563a6" stroke-width="2.5" marker-end="url(#blue-arrow)"/>
<rect x="36" y="246" width="480" height="62" rx="12" fill="#eaf2fe" stroke="#ccd9e4" stroke-width="1.5"/>
<text x="55" y="285" font-size="22" fill="#183044" font-weight="normal">②  result = add_bonus(70)</text>
<rect x="626" y="246" width="338" height="149" rx="12" fill="#eaf6f1" stroke="#ccd9e4" stroke-width="1.5"/>
<text x="648" y="282" font-size="22" fill="#137b68" font-weight="normal">③  score 接收到 70</text>
<text x="648" y="321" font-size="21" fill="#183044" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace">return score + 10</text>
<text x="648" y="364" font-size="21" fill="#137b68" font-weight="normal">返回 80，结束本次调用</text>
<path d="M 518 277 H 622" fill="none" stroke="#2563a6" stroke-width="2.5" marker-end="url(#blue-arrow)"/>
<text x="536" y="258" font-size="18" fill="#2563a6" font-weight="normal">传入 70</text>
<rect x="36" y="371" width="480" height="62" rx="12" fill="#eaf6f1" stroke="#ccd9e4" stroke-width="1.5"/>
<text x="55" y="410" font-size="22" fill="#183044" font-weight="normal">④  将返回的 80 赋给 result</text>
<path d="M 626 353 H 573 V 402 H 520" fill="none" stroke="#137b68" stroke-width="2.5" marker-end="url(#green-arrow)"/>
<text x="574" y="435" font-size="18" fill="#137b68" font-weight="normal">返回 80</text>
<path d="M 276 435 V 465" fill="none" stroke="#2563a6" stroke-width="2.5" marker-end="url(#blue-arrow)"/>
<rect x="36" y="469" width="480" height="62" rx="12" fill="white" stroke="#ccd9e4" stroke-width="1.5"/>
<text x="55" y="508" font-size="22" fill="#183044" font-weight="normal">⑤  print(result)  显示 80</text>
<path d="M 276 533 V 563" fill="none" stroke="#2563a6" stroke-width="2.5" marker-end="url(#blue-arrow)"/>
<rect x="36" y="567" width="480" height="62" rx="12" fill="white" stroke="#ccd9e4" stroke-width="1.5"/>
<text x="55" y="606" font-size="23" fill="#183044" font-weight="normal">⑥  print(&quot;计算结束&quot;)</text>
<text x="626" y="502" font-size="22" fill="#526778" font-weight="normal">调用完成后，</text>
<text x="626" y="538" font-size="22" fill="#526778" font-weight="normal">从原来的位置继续执行。</text>
</g></svg>
